      - torch>=2.6.0
      - torchvision
      - torchaudio
      - hydra-core==1.3.2
      - hydra-colorlog==1.2.0
      - omegaconf>=2.3.0
      - rootutils>=1.0.7
      - gradio>=5.0.0
