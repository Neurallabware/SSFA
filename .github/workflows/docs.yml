name: Documentation
on:
  pull_request:
    paths: ["docs/**", ".readthedocs.yaml", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["docs/**", ".readthedocs.yaml", ".github/workflows/docs.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  html:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          submodules: false
          sparse-checkout: |
            docs
            .readthedocs.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: python -m pip install -r docs/requirements.txt
      - run: python -m sphinx -b html -n -W --keep-going docs docs/_build/html
