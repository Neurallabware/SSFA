crop:
  patch_size: [64, 256, 256]
  n_patch_all: 150
  n_patch_train: 999999
  dataset_dir: ${paths.data_dir}/dataset_orig
  output_dir: ${paths.data_dir}/dataset_in_patches_BG
  seed: 42

train:
  lr: 0.0001
  lr_drop: 10
  batch_size: 16
  start_epoch: 0
  epochs: 50
  wo_mean: true
  gsize: 8
  in_channels: 1
  out_channels: 1
  f_maps: 32
  L1_weight: 1.0
  L2_weight: 1.0
  dataset_name: ""
  dataset_dir: ${paths.data_dir}/dataset_orig
  output_dir: ${paths.output_dir}/BG_output
  seed: 42
  device: cuda
  resume: ""
  eval: false
  num_workers: 8
  gpu_ids: "0"

infer:
  batch_size: 1
  wo_mean: true
  patch_size: [128, 128, 128]
  stride_size: [96, 96, 96]
  gsize: 8
  in_channels: 1
  out_channels: 1
  f_maps: 32
  dataset_dir: ${paths.data_dir}/dataset_orig
  output_dir: ${paths.output_dir}/BG_output/res_videos
  ckpt_dir: ${paths.bg_ckpt_dir}
  device: cuda
  gpu_ids: "0"

post:
  dataset_name: rmbg
  dataset_dir: ${bg.infer.output_dir}
  threshold_max: 0.5
